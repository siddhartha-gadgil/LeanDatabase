name = "LeanDatabase"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanDatabase", "Examples"]
testDriver = "Examples"

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "LeanDatabase"

[[lean_lib]]
name = "Examples"
globs = ["Examples.+"]

# The proven cross-skill equivalences. Building this lib re-checks every `sql_equiv` proof — the
# regression gate for core-elaboration changes (`lake build Bench`). Kept out of defaultTargets so a
# plain `lake build` stays fast.
[[lean_lib]]
name = "Bench"
globs = ["Bench.CrossSkill.Proven.+"]

[[lean_exe]]
name = "sql_process"
supportInterpreter = true

[[lean_exe]]
name = "elabcheck"
root = "Bench.CrossSkill.Elabcheck"
supportInterpreter = true

[[lean_exe]]
name = "provecheck"
root = "Bench.CrossSkill.Provecheck"
supportInterpreter = true










[[lean_exe]]
name = "runall"
root = "Bench.RunAll"
supportInterpreter = true

[[lean_exe]]
name = "refute"
root = "Bench.Refute"
supportInterpreter = true
